<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Token Swatch Sheet - logo.png</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #f8fafc; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; max-width: 1000px; margin-top: 1.5rem; }
    .card { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; background: white; }
    .color-block { height: 100px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .info { padding: 1rem; }
    .name { font-size: 0.875rem; font-weight: 600; color: #1e293b; }
    .hex { font-size: 0.875rem; color: #64748b; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Brand Token Swatches</h1>
  <p>Derived from: <code>./public/assets/logo.png</code></p>
  <div class="grid">
    <div class="card">
      <div class="color-block" style="background: #0f2252; color: #ffffff;">Aa</div>
      <div class="info"><div class="name">brand</div><div class="hex">#0f2252</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #ffffff; color: #0f2252; border: 1px solid #ddd;">Aa</div>
      <div class="info"><div class="name">brandFg</div><div class="hex">#ffffff</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #eab430; color: #111827;">Aa</div>
      <div class="info"><div class="name">accent</div><div class="hex">#eab430</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #111827; color: #eab430;">Aa</div>
      <div class="info"><div class="name">accentFg</div><div class="hex">#111827</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #fffdfa; color: #140c00; border: 1px solid #ddd;">Aa</div>
      <div class="info"><div class="name">surface</div><div class="hex">#fffdfa</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #f3f0ea; color: #140c00;">Aa</div>
      <div class="info"><div class="name">surfaceAlt</div><div class="hex">#f3f0ea</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #140c00; color: #ffffff;">Aa</div>
      <div class="info"><div class="name">ink</div><div class="hex">#140c00</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #585246; color: #ffffff;">Aa</div>
      <div class="info"><div class="name">inkMuted</div><div class="hex">#585246</div></div>
    </div>
    <div class="card">
      <div class="color-block" style="background: #d5d0c6; color: #140c00;">Aa</div>
      <div class="info"><div class="name">border</div><div class="hex">#d5d0c6</div></div>
    </div>
  </div>
</body>
</html>
